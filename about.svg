<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 289" width="860" height="289">
<style>text{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:13px;fill:#c9d1d9;white-space:pre}.g{fill:#39d353}.d{fill:#1f6f3a}.p{fill:#58a6ff}.t{fill:#8b949e;font-size:12px}.w{fill:#f0f6fc}.y{fill:#e3b341}.b{font-weight:bold}.l{opacity:0;animation:in .45s ease-out forwards}.u{opacity:0;animation:up .4s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:bl 1s steps(1) infinite}</style>
<rect width="860" height="289" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="20" cy="18" r="5" fill="#ff5f56"/><circle cx="38" cy="18" r="5" fill="#ffbd2e"/><circle cx="56" cy="18" r="5" fill="#27c93f"/>
<text class="t" x="76" y="22">imandro@github: ~/about</text>
<text x="26" y="48"><tspan class="p">$</tspan> cat about.md</text>
<text class="l w" style="animation-delay:0.30s" x="26" y="78">Hola, soy Mario 👋 Desde Nicaragua construyo software que protege a las personas: apps que funcionan</text>
<text class="l w" style="animation-delay:0.42s" x="26" y="99">sin internet, cuidan tus datos y llegan a producción sin drama.</text>
<text class="l " style="animation-delay:0.54s" x="26" y="132">Vivo en la intersección de tres cosas: desarrollo de software, ciberseguridad y DevOps, con AWS como</text>
<text class="l " style="animation-delay:0.66s" x="26" y="153">mi casa en la nube. Me obsesiona automatizar lo repetitivo y blindar lo importante.</text>
<text class="l " style="animation-delay:0.78s" x="26" y="186">He ganado 12 concursos tecnológicos y de software, y con DataStorm creé AliviaApp, un refugio</text>
<text class="l " style="animation-delay:0.90s" x="26" y="207">digital de bienestar mental para jóvenes. Si quieres colaborar, retarme o hablar de código,</text>
<text class="l " style="animation-delay:1.02s" x="26" y="228">escríbeme.</text>
<text x="26" y="265"><tspan class="p">$</tspan> <tspan class="g cur">█</tspan></text>
</svg>